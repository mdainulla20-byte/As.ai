<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>এএস এআই</title><style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center}.a{width:100%;max-width:400px;background:#080808;min-height:100vh;display:flex;flex-direction:column}.t{padding:14px;background:#111;font-weight:900;text-align:center;border-bottom:1px solid #222}.c{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}.m{padding:11px 14px;border-radius:18px;font-size:13px;max-width:82%}.b{background:#1c1c1c}.u{background:#fff;color:#000;align-self:flex-end}.p{margin:10px;background:#fff;color:#000;border-radius:16px;padding:14px;text-align:center}.n{background:#000;color:#fff;padding:11px;border-radius:10px;margin:6px 0;font-weight:900;font-size:17px}.i{display:flex;gap:6px;padding:10px;border-top:1px solid #222}input{flex:1;background:#1a1a1a;border:0;color:#fff;padding:12px 16px;border-radius:24px;outline:0}button{border:0;background:#fff;color:#000;border-radius:24px;padding:12px 16px;font-weight:900}</style></head><body><div class="a"><div class="t">এএস এআই - লাইভ চ্যাট</div><div class="c" id="c"><div class="m b">আসসালামু আলাইকুম! কি জানতে চান বলেন?</div></div><div class="p"><b>✅ পেমেন্ট নাম্বার</b><div class="n">০১৯৪৫৯৫২৫৩৩ - রকেট/উপায়</div><div class="n">০১৭১৩৪৭২৯৪২ - নগদ</div></div><div class="i"><input id="q" placeholder="এখানে লিখুন..."><button onclick="s()">➤</button></div></div><script>
const ch=document.getElementById('c');
function a(t,c){let d=document.createElement('div');d.className='m '+c;d.innerHTML=t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight}
function r(m){
m=m.toLowerCase();
if(m.includes("দাম")||m.includes("কত")) return "দাম মাত্র ১৪৯৯ টাকা স্যার।";
if(m.includes("নাম্বার")||m.includes("বিকাশ")||m.includes("নগদ")||m.includes("রকেট")) return "নাম্বার: <br>০১৯৪৫৯৫২৫৩৩ (রকেট/উপায়)<br>০১৭১৩৪৭২৯৪২ (নগদ)";
if(m.includes("কিভাবে")||m.includes("কেমনে")) return "উপরের নাম্বারে সেন্ড মানি করে লাস্ট ৪ ডিজিট দিন, আমি চালু করে দিবো।";
if(m.includes("হ্যালো")||m.includes("সালাম")||m.includes("hi")) return "ওয়ালাইকুম সালাম স্যার, বলেন কিভাবে হেল্প করবো?";
return "বুঝেছি স্যার। '"+m+"' - এটা হয়ে যাবে। পেমেন্ট করে জানান।";
}
function s(){
let i=document.getElementById('q');if(!i.value)return;
a(i.value,'u');let v=i.value;i.value='';
setTimeout(()=>{a(r(v),'b')},500)
}
document.getElementById('q').addEventListener('keypress',e=>{if(e.key==='Enter')s()});
</script></body></html>
